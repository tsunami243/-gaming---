name: gameboi
# 所有凭据均来自宿主环境（推荐 `docker compose --env-file deploy/.env`）。
# deploy/.env 不入库（见 .gitignore / .dockerignore），仓库里只保留 .env.example 占位模板。
services:
  mysql:
    image: mysql:8.4.6
    command: ["--innodb-buffer-pool-size=536870912", "--max-connections=40"]
    environment:
      MYSQL_DATABASE: gameboi
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    networks: [gameboi-internal]
    mem_limit: 1200000000
    memswap_limit: 1200000000
    cpus: 1
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server","--appendonly","yes","--maxmemory","100663296","--maxmemory-policy","noeviction"]
    volumes: [redis-data:/data]
    networks: [gameboi-internal]
    mem_limit: 200000000
    memswap_limit: 200000000
    cpus: 0.25
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
  backend:
    build: { context: .., dockerfile: deploy/Dockerfile.backend }
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      INGEST_SERVICE_TOKEN: ${INGEST_SERVICE_TOKEN}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gameboi?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATA_REDIS_HOST: redis
    depends_on: [mysql, redis]
    networks: [gameboi-internal]
    mem_limit: 1200000000
    memswap_limit: 1200000000
    cpus: 1
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
  frontend:
    build: { context: .., dockerfile: deploy/Dockerfile.frontend }
    depends_on: [backend]
    ports: ["${GAMEBOI_HTTP_PORT:-8088}:80"]
    networks: [gameboi-internal]
    mem_limit: 100000000
    memswap_limit: 100000000
    cpus: 0.25
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
    restart: unless-stopped
  ingest:
    build: { context: .., dockerfile: deploy/Dockerfile.ingest }
    environment:
      INGEST_INTERNAL_BASE_URL: http://backend:8080
      INGEST_SERVICE_TOKEN: ${INGEST_SERVICE_TOKEN}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # 第三方凭据一律由宿主环境/compose env-file 注入，绝不写进镜像或仓库。
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-beijing.aliyuncs.com}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      RUNTIME_STATE_PATH: /var/lib/gameboi/ingest_state.sqlite3
      OUTBOX_PATH: /var/lib/gameboi/outbox.sqlite3
      CAPACITY_SNAPSHOT_PATH: /var/lib/gameboi/capacity.json
    volumes: [ingest-data:/var/lib/gameboi]
    depends_on: [backend, redis]
    networks: [gameboi-internal]
    mem_limit: 450000000
    memswap_limit: 450000000
    cpus: 0.5
    logging:
      driver: local
      options: { max-size: "10m", max-file: "3" }
    profiles: [ingest]
    restart: "no"
networks:
  gameboi-internal: { name: gameboi_internal, internal: true }
volumes:
  mysql-data: { name: gameboi_mysql_data }
  redis-data: { name: gameboi_redis_data }
  ingest-data: { name: gameboi_ingest_data }
