server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Service credentials must never make internal ingestion publicly reachable.
  location /internal/ { return 404; }
  location /api/internal/ { return 404; }

  location ^~ /api/v1/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # 必须用 $remote_addr 覆盖（不能用 $proxy_add_x_forwarded_for）：
    # 后者会把客户端自带的伪造值留在最前面，后端一旦取第一段就等于信任了攻击者。
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  # Compatibility routes, including login, remain unversioned on the backend.
  location ~ ^/api/(user|article|category|comment|article-like|article-favorite|article-view|comment-like|upload)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    # 同上：覆盖为直连对端地址，保证后端看到的 XFF 只有一跳。
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /api/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
