server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Service credentials must never make internal ingestion publicly reachable.
  location /internal/ { return 404; }
  location /api/internal/ { return 404; }

  location ^~ /api/v1/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # Compatibility routes, including login, remain unversioned on the backend.
  location ~ ^/api/(user|article|category|comment|article-like|article-favorite|article-view|comment-like|upload)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /api/ { return 404; }
  location / { try_files $uri $uri/ /index.html; }
}
