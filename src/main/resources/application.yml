spring:
  datasource:
    url: jdbc:mysql://localhost:3306/big_event?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 配置Redis连接
  data:
    redis:
      port: 6379
      host: localhost
      connect-timeout: 3s
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2s
        shutdown-timeout: 1s
# JWT 配置
jwt:
  secret-key: ${JWT_SECRET_KEY:tsunami1234567890abcdefghijklmnopqrstuvwxyz}
  expiration: 43200000  # 12小时（毫秒）

#配置MyBatis
mybatis:
  mapper-locations: classpath:org/example/bigevent/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
