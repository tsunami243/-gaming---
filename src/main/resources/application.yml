spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  servlet:
    multipart:
      # 默认上限只有 1MB，会让 FileUploadController 里"超 5MB 才报错"的分支永远不可达，
      # 1~5MB 的文件反而先抛 MaxUploadSizeExceededException。这里显式抬到接口声称的上限。
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    # 连接串带本地默认值；库名/账号/口令一律从环境变量注入，仓库内不留任何真实凭据。
    # 变量名与 deploy/compose.yaml、init.sh 保持一致（DB_USERNAME / DB_PASSWORD）。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/big_event?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 配置Redis连接
  data:
    redis:
      port: 6379
      host: localhost
      connect-timeout: 3s
      timeout: 5s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2s
        shutdown-timeout: 1s
# JWT 配置
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: 43200000  # 12小时（毫秒）

# 推送平台 demo 模块配置
push:
  token-bucket:
    capacity: 50        # 令牌桶容量（允许突发）
    refill-per-second: 50  # 每秒补充速率 = 限流水位（微信频控安全线的一半）
  max-retry: 3          # 失败最大重试次数，超过进死信
  mock:
    api-limit: 50       # 模拟微信 API 每秒上限（超过返回 45009）
    failure-rate: 0.08  # 模拟网络失败概率
    permanent-reject-rate: 0.01  # 模拟用户退订（不可重试，直接死信）

#配置MyBatis
mybatis:
  mapper-locations: classpath:org/example/bigevent/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    # 默认 info：DEBUG 会把 SQL 与参数值（含邮箱、口令哈希）整体打进日志，生产不得开启。
    org.example.bigevent.mapper: info

ingest:
  service-token: ${INGEST_SERVICE_TOKEN}

  legacy-queue:
    enabled: false  # Only enable during a documented, one-time legacy Redis backlog migration.

# Enable only after moderation, rate limiting and capacity acceptance.
comments:
  submission-enabled: false

---
# 仅本地开发：开启 Mapper SQL 明细日志，便于排查。
# 用法：java -jar app.jar --spring.profiles.active=dev
spring.config.activate.on-profile: dev
logging:
  level:
    org.example.bigevent.mapper: debug
